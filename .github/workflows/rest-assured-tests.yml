name: REST Assured API Tests

on:
  push:
    branches: [main]
    paths:
      - "rest-assured/**"
      - ".github/workflows/rest-assured-tests.yml"

  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rest-assured

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: rest-assured/pom.xml

      - name: Run REST Assured tests
        run: mvn clean test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rest-assured-test-results
          path: rest-assured/target/surefire-reports/
          if-no-files-found: warn

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rest-assured-allure-results
          path: rest-assured/target/allure-results/
          if-no-files-found: warn


      - name: Generate Allure HTML report
        if: always()
        run: |
          npm install -g allure-commandline@2.29.0
          allure generate target/allure-results --clean -o target/allure-report

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rest-assured-allure-html
          path: rest-assured/target/allure-report/
          if-no-files-found: warn

